# Конфигурация pytest для «АвтоПрайс».
#
# -p no:libtmux — отключение стороннего плагина libtmux, который в CI-среде
#   ломает сбор тестов («Marks cannot be applied to fixtures»). На машине
#   Заказчика плагин, как правило, отсутствует — директива безвредна.
[pytest]
addopts = -p no:libtmux
testpaths = tests
